version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ahla_postgres
    environment:
      POSTGRES_USER: ahla_user
      POSTGRES_PASSWORD: ahla_pass
      POSTGRES_DB: ahla_shabab
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ahla_redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
