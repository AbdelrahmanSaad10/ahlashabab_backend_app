name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            cd /var/www/ahlashabab-backend
            git pull origin main
            npm install
            npx prisma generate
            npx nest build
            npx prisma db push --skip-generate
            npx prisma db seed
            pm2 restart ahlashabab-api --update-env
            echo "Backend deployed successfully"
