name: Deploy Backend

# The schema step used to be `npx prisma db push --skip-generate`, and stayed that
# way after T-01 baselined the migrations. `db push` has no history, no review step
# and no plan: it issues whatever DDL makes the database match schema.prisma,
# including dropping and rewriting columns, against a live database holding
# donations and beneficiary records.
#
# It is not simply replaced by `migrate deploy`: production's schema was created
# by `db push`, so it has no `_prisma_migrations` table and Prisma refuses with
# P3005. `scripts/apply-schema.js` reads the database and picks — deploy when the
# history exists or the database is empty, and otherwise stop with the one-time
# baseline commands, changing nothing. See prisma/migrations/README.md.
#
# This workflow still does NOT wait for CI (`needs: [test]`), which is a release
# policy call — see qa/REMAINING_TASKS.md.

on:
  push:
    branches: [main]
  # Manually re-runnable. The SSH connection to the server times out
  # intermittently — three times in one afternoon — and without this, retrying a
  # deploy meant pushing an empty commit.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            # Without this the script runs every line regardless. A failing
            # schema step was followed by the seed and `pm2 restart`, and the
            # workflow reported success — the schema failure was visible only by
            # reading the log. Any step failing now stops the deploy and turns it
            # red.
            set -euo pipefail
            cd /var/www/ahlashabab-backend

            # `git pull` refuses outright when the server has commits of its own
            # — "divergent branches", and the deploy stops before it starts. That
            # happened, because a change was written directly on this machine.
            #
            # A deploy target should mirror origin, not hold work. Fetch and reset
            # makes that true, and says loudly what it is about to discard rather
            # than dropping it silently; the "Preserve server-only commits"
            # workflow captures anything worth keeping first.
            git fetch origin main
            AHEAD=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo 0)
            if [ "$AHEAD" != "0" ]; then
              echo "⚠ discarding $AHEAD commit(s) that exist only on this server:"
              git log --format='    %h %an — %s' origin/main..HEAD
              echo "  If that is not intended, stop and run the"
              echo "  'Preserve server-only commits' workflow before deploying again."
            fi
            git reset --hard origin/main
            npm install
            npx prisma generate
            npx nest build
            node scripts/apply-schema.js
            npx prisma db seed
            pm2 restart ahlashabab-api --update-env
            echo "Backend deployed successfully"
