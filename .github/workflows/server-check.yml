name: Server check (read-only)

# A manually-triggered, read-only look at the live server, over the SSH
# connection the deploy already uses. Nothing here writes, restarts or changes
# anything — it exists so that "is it actually configured?" can be answered
# without a shell, and without waiting on whoever has one.
#
# ⚠️ THIS REPOSITORY IS PUBLIC, so this workflow's log is public. Nothing in it
# may print a secret. Environment variables are reported as `set` / `not set`
# and never by value, and the log greps are narrowed to specific boot lines
# rather than dumping application output, which can contain request data.
#
# The one exception is TRUST_PROXY, whose value is printed because it is a hop
# count, not a credential, and knowing which hop count is live is the whole point
# of checking it.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect the server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 3m
          script: |
            set -uo pipefail
            cd /var/www/ahlashabab-backend

            echo "═══ deployed code ═══════════════════════════════════════════"
            git fetch -q origin main 2>/dev/null || true
            echo "  on server : $(git rev-parse --short HEAD) — $(git log -1 --format=%s | cut -c1-70)"
            echo "  on origin : $(git rev-parse --short origin/main)"
            BEHIND=$(git rev-list --count HEAD..origin/main 2>/dev/null || echo '?')
            echo "  behind    : $BEHIND commit(s)"

            # Commits that exist only here. The first run of this job found one:
            # a change made directly on the production server, in no repository,
            # unreviewed, never through CI, and lost or conflicting the moment
            # anyone pulls. Worth surfacing every time rather than never.
            DRIFT=$(git log --oneline origin/main..HEAD 2>/dev/null | wc -l | tr -d ' ')
            if [ "$DRIFT" != "0" ]; then
              echo
              echo "  ⚠ $DRIFT commit(s) exist ONLY on this server:"
              git log --format='    %h %ad %an — %s' --date=short origin/main..HEAD 2>/dev/null
              echo
              echo "  files they touch:"
              git diff --stat origin/main...HEAD 2>/dev/null | sed 's/^/    /'
              echo
              echo "  the change itself:"
              git diff origin/main...HEAD 2>/dev/null | head -260 | sed 's/^/    /'
            fi

            echo
            echo "  uncommitted changes in the working tree:"
            git status --porcelain 2>/dev/null | head -20 | sed 's/^/    /' || true
            [ -z "$(git status --porcelain 2>/dev/null)" ] && echo "    (none)"

            echo
            echo "═══ process ════════════════════════════════════════════════"
            # Restart count matters: a number that climbs on its own is a crash
            # loop, which looks identical to "running" in a one-line status.
            pm2 jlist 2>/dev/null | node -e '
              let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{
                try{
                  const p=JSON.parse(d).find(x=>x.name==="ahlashabab-api");
                  if(!p) return console.log("  ahlashabab-api NOT FOUND in pm2");
                  const up=Math.round((Date.now()-p.pm2_env.pm_uptime)/1000);
                  console.log(`  status ${p.pm2_env.status} · uptime ${up}s · restarts ${p.pm2_env.restart_time} · mem ${Math.round(p.monit.memory/1048576)}mb`);
                }catch(e){console.log("  could not parse pm2 output")}
              })'

            echo
            echo "═══ configuration (presence only — never values) ════════════"
            for v in FIREBASE_SERVICE_ACCOUNT FIREBASE_SERVICE_ACCOUNT_PATH FCM_SERVER_KEY \
                     SMTP_HOST SMTP_USER SMTP_PASS EMAIL_PROVIDER_KEY \
                     WEBHOOK_SECRET JWT_ACCESS_SECRET SEED_ADMIN_PASSWORD; do
              if grep -qE "^${v}=.+" .env 2>/dev/null; then echo "  $v = set"; else echo "  $v = (not set)"; fi
            done
            # A hop count, not a credential — and the value is the point.
            echo "  $(grep -E '^TRUST_PROXY=' .env 2>/dev/null || echo 'TRUST_PROXY= (not set)')"

            echo
            echo "  notes:"
            grep -qE "^FIREBASE_SERVICE_ACCOUNT=.+|^FIREBASE_SERVICE_ACCOUNT_PATH=.+" .env 2>/dev/null \
              || echo "    · push is DISABLED — notifications reach the in-app feed and no phone"
            grep -qE "^TRUST_PROXY=[^f]" .env 2>/dev/null \
              || echo "    · TRUST_PROXY unset — every visitor shares one rate-limit bucket"
            grep -qE "^SEED_ADMIN_PASSWORD=.+" .env 2>/dev/null \
              && echo "    · SEED_ADMIN_PASSWORD is still in .env — it is only needed to create the"
            grep -qE "^SEED_ADMIN_PASSWORD=.+" .env 2>/dev/null \
              && echo "      first administrator, and is a plaintext password sitting on disk. Remove it."

            echo
            echo "═══ what the app said at boot ══════════════════════════════"
            # Narrow greps on purpose: a full log dump can contain request data.
            pm2 logs ahlashabab-api --nostream --lines 400 2>/dev/null \
              | grep -E "TRUST_PROXY=|Push notifications (enabled|are DISABLED)|Server running" \
              | tail -5 | sed 's/^/  /' || true
            echo "  (nothing above means those lines have scrolled out of the log)"

            echo
            echo "═══ database ═══════════════════════════════════════════════"
            npx prisma migrate status 2>&1 | grep -E "migrations found|up to date|not yet been applied|failed" | sed 's/^/  /'

            echo
            echo "═══ backups ════════════════════════════════════════════════"
            # A charity's database holds donor records, national ID numbers and
            # beneficiary details. Whether a copy of it exists anywhere is a
            # bigger question than any line in the cost estimate, and nobody had
            # asked it. Paths and counts only — never contents.
            FOUND=0

            CRON=$(crontab -l 2>/dev/null | grep -icE "pg_dump|backup|dump" | head -1)
            CRON=${CRON:-0}
            if [ "$CRON" -gt 0 ] 2>/dev/null; then
              echo "  root crontab — $CRON backup-looking entr(y/ies):"
              crontab -l 2>/dev/null | grep -iE "pg_dump|backup|dump" | sed 's/^/    /'
              FOUND=1
            fi

            SYS=$(grep -rliE "pg_dump|pgbackrest|barman" /etc/cron.d /etc/cron.daily /etc/systemd/system 2>/dev/null | head -5)
            [ -n "$SYS" ] && { echo "  scheduled by:"; echo "$SYS" | sed 's/^/    /'; FOUND=1; }

            # Name them. "1 timer matched" could be a real backup or an unrelated
            # unit with the word in it, and the difference is the whole answer.
            TIMERS=$(systemctl list-timers --all --no-pager 2>/dev/null | grep -iE "backup|dump" | awk '{print $NF}' | head -5)
            if [ -n "$TIMERS" ]; then
              echo "  systemd timers matching backup/dump:"
              echo "$TIMERS" | sed 's/^/    /'
              FOUND=1
            fi

            DUMPS=$(find /root /var/backups /opt /home /mnt -maxdepth 3 \
                      \( -name "*.sql" -o -name "*.sql.gz" -o -name "*.dump" -o -name "*.tar.gz" \) \
                      2>/dev/null | head -5)
            if [ -n "$DUMPS" ]; then
              echo "  dump-looking files:"
              echo "$DUMPS" | while read -r f; do
                echo "    $f  ($(du -h "$f" 2>/dev/null | cut -f1), modified $(date -r "$f" +%Y-%m-%d 2>/dev/null))"
              done
              FOUND=1
            fi

            if [ "$FOUND" = "0" ]; then
              echo "  ⚠ NO BACKUP MECHANISM FOUND on this machine."
              echo "    No cron entry, no systemd timer, no dump file anywhere obvious."
              echo "    This does not rule out a snapshot taken by the hosting provider —"
              echo "    that cannot be seen from inside the server and must be confirmed"
              echo "    in the provider's control panel."
            fi

            echo
            echo "═══ data integrity ═════════════════════════════════════════"
            # Whether any slot is double-booked among non-cancelled rows. T-09
            # proved the application refuses a concurrent double-booking, but
            # nothing at the database level enforces it — and the partial unique
            # index that would was left unapplied precisely because this could not
            # be checked. Counts only; no row data is printed.
            node -e '
              const { PrismaClient } = require("@prisma/client");
              const p = new PrismaClient();
              (async () => {
                try {
                  const dupes = await p.$queryRawUnsafe(`
                    SELECT count(*)::int AS groups, coalesce(sum(n) - count(*), 0)::int AS extra
                    FROM (
                      SELECT provider_id, date, time_slot, count(*) AS n
                      FROM bookings WHERE status <> $$ملغي$$
                      GROUP BY 1,2,3 HAVING count(*) > 1
                    ) d`);
                  const total = await p.booking.count();
                  console.log("  bookings total          : " + total);
                  console.log("  slots double-booked     : " + dupes[0].groups);
                  console.log("  surplus rows            : " + dupes[0].extra);
                  console.log(dupes[0].groups === 0
                    ? "  ✓ no duplicates — the partial unique index can be applied safely"
                    : "  ⚠ duplicates present — they must be resolved before the index can be created");
                } catch (e) {
                  console.log("  could not query: " + e.message.split("\n")[0]);
                } finally { await p.$disconnect(); }
              })();
            '

            echo
            echo "═══ health, from the server itself ═════════════════════════"
            # Bypasses Cloudflare and nginx, so a failure here is the app itself.
            PORT=$(grep -E '^PORT=' .env 2>/dev/null | cut -d= -f2 | tr -d '\r' || echo 4000)
            curl -s --max-time 5 "http://127.0.0.1:${PORT:-4000}/api/v1/health" | sed 's/^/  /' || echo "  no response"

            echo
            echo
            echo "═══ disk ═══════════════════════════════════════════════════"
            df -h / | tail -1 | sed 's/^/  /'
