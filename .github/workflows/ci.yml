name: CI

# There was NO test gate anywhere. `deploy.yml` triggers on push to main and goes
# straight to `git pull && nest build && pm2 restart` on the production server, so
# the first place a compile error or a failing test could surface was production
# itself. This workflow runs the checks somewhere they can fail safely.
#
# It deliberately does NOT gate the deploy: adding `needs: [test]` to deploy.yml is
# a one-line change, but it would block releases on a red suite and that is the
# maintainers' call, not a side effect of adding CI. See qa/REMAINING_TASKS.md T-12.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # A disposable PostgreSQL for the integration suite. It exists only for the
    # life of this job, so the tests can create, mutate and delete freely — the
    # one thing they must never do is touch a real database, which is why the
    # specs also refuse a URL that looks like production.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ahla_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ahla_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-long-enough
      JWT_REFRESH_SECRET: ci-refresh-secret-long-enough
      # Throwaway value for the integration suite only — it signs and verifies
      # its own callbacks. NOT the production secret, which lives in the server's
      # environment and is required at boot there (see T-11).
      WEBHOOK_SECRET: ci-webhook-secret-at-least-16-chars

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Needed before the typecheck: the build imports @prisma/client's generated
      # types. No database connection is involved.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build (typecheck)
        run: npm run build

      - name: Test (unit + e2e)
        run: npm run test:ci

      # Applies the baselined migrations from T-01 to an empty database, which
      # also re-proves on every push that they build the schema from scratch.
      - name: Prepare the integration database
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: Test (integration — against a real database)
        run: npm run test:int
